name: Bugbot Status Check

on:
  issue_comment:
    types: [created, edited]

jobs:
  check-bugbot-lgtm:
    # Only run on PR comments from cursor[bot]
    if: |
      github.event.issue.pull_request &&
      github.event.comment.user.login == 'cursor[bot]'
    runs-on: ubuntu-latest
    permissions:
      statuses: write
      pull-requests: read
    steps:
      - name: Get PR head SHA
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_DATA=$(gh api repos/${{ github.repository }}/pulls/${{ github.event.issue.number }})
          echo "sha=$(echo $PR_DATA | jq -r .head.sha)" >> $GITHUB_OUTPUT

      - name: Check for LGTM and set status
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          SHA="${{ steps.pr.outputs.sha }}"

          # Check for rejection signals first (avoids false positives like "not good to merge")
          if echo "$COMMENT_BODY" | grep -iqE "(changes? requested|needs? (changes?|work|fix)|not ready|block)"; then
            echo "Bugbot requested changes, setting pending status..."
            gh api repos/${{ github.repository }}/statuses/$SHA \
              -f state=pending \
              -f context="bugbot-review" \
              -f description="Bugbot requested changes"
          # Then check for explicit approval signals
          elif echo "$COMMENT_BODY" | grep -iqE "(LGTM|good to merge|approved)"; then
            echo "Bugbot approved! Setting success status..."
            gh api repos/${{ github.repository }}/statuses/$SHA \
              -f state=success \
              -f context="bugbot-review" \
              -f description="Bugbot approved this PR"
          else
            echo "No clear approval or rejection signal in bugbot comment"
          fi
