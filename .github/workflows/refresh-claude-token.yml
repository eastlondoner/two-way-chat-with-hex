name: Refresh Claude Token

on:
  schedule:
    # Run every 2 hours (well before the 8-hour expiry)
    - cron: '0 */2 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  actions: write      # Required to update repository variables
  contents: read      # Required to checkout

jobs:
  refresh-token:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore credentials
        id: restore
        env:
          # Use vars context to access repository variables directly
          ENCODED_CREDS: ${{ vars.CLAUDE_CREDENTIALS }}
        run: |
          if [ -z "$ENCODED_CREDS" ]; then
            echo "No credentials found, skipping refresh"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Decode and save credentials
          mkdir -p ~/.claude
          echo "$ENCODED_CREDS" | base64 -d > ~/.claude/.credentials.json
          chmod 600 ~/.claude/.credentials.json

          # Extract tokens and expiry
          REFRESH_TOKEN=$(cat ~/.claude/.credentials.json | jq -r '.claudeAiOauth.refreshToken')
          EXPIRES_AT=$(cat ~/.claude/.credentials.json | jq -r '.claudeAiOauth.expiresAt')
          EXPIRES_DATE=$(date -d @$((EXPIRES_AT / 1000)) 2>/dev/null || echo "unknown")

          echo "Current token expires at: $EXPIRES_AT ($EXPIRES_DATE)"

          if [ -z "$REFRESH_TOKEN" ] || [ "$REFRESH_TOKEN" = "null" ]; then
            echo "::error::No refresh token found in credentials"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "skip=false" >> $GITHUB_OUTPUT
          echo "old_expires_at=$EXPIRES_AT" >> $GITHUB_OUTPUT
          # Store refresh token in temp file to avoid exposing in logs
          echo "$REFRESH_TOKEN" > /tmp/refresh_token

      - name: Refresh token via API
        if: steps.restore.outputs.skip != 'true'
        id: refresh
        run: |
          REFRESH_TOKEN=$(cat /tmp/refresh_token)
          rm -f /tmp/refresh_token

          # Claude Code CLI client_id (from oauth flow analysis)
          CLIENT_ID="9d1c250a-e61b-44d9-88ed-5944d1962f5e"

          echo "Calling token refresh API..."

          # Call the OAuth token refresh endpoint directly
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://api.anthropic.com/v1/oauth/token" \
            -H "Content-Type: application/json" \
            -d "{
              \"grant_type\": \"refresh_token\",
              \"refresh_token\": \"$REFRESH_TOKEN\",
              \"client_id\": \"$CLIENT_ID\"
            }" 2>&1)

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP Status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Token refresh API returned $HTTP_CODE"
            echo "$BODY" | jq '.' 2>/dev/null || echo "$BODY"
            echo "refreshed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Extract new tokens from response
          NEW_ACCESS_TOKEN=$(echo "$BODY" | jq -r '.access_token // empty')
          NEW_REFRESH_TOKEN=$(echo "$BODY" | jq -r '.refresh_token // empty')
          EXPIRES_IN=$(echo "$BODY" | jq -r '.expires_in // empty')

          if [ -z "$NEW_ACCESS_TOKEN" ]; then
            echo "::error::No access_token in response"
            echo "$BODY" | jq '.' 2>/dev/null || echo "$BODY"
            echo "refreshed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Calculate new expiry timestamp (current time + expires_in seconds)
          if [ -n "$EXPIRES_IN" ]; then
            NEW_EXPIRES_AT=$(( $(date +%s) * 1000 + EXPIRES_IN * 1000 ))
          else
            # Default to 8 hours if not provided
            NEW_EXPIRES_AT=$(( $(date +%s) * 1000 + 28800000 ))
          fi

          NEW_EXPIRES_DATE=$(date -d @$((NEW_EXPIRES_AT / 1000)) 2>/dev/null || echo "unknown")
          echo "Token refreshed! New expiry: $NEW_EXPIRES_AT ($NEW_EXPIRES_DATE)"

          # Update credentials file
          CREDS=$(cat ~/.claude/.credentials.json)

          # Update access token
          CREDS=$(echo "$CREDS" | jq --arg token "$NEW_ACCESS_TOKEN" '.claudeAiOauth.accessToken = $token')

          # Update refresh token if a new one was provided
          if [ -n "$NEW_REFRESH_TOKEN" ]; then
            CREDS=$(echo "$CREDS" | jq --arg token "$NEW_REFRESH_TOKEN" '.claudeAiOauth.refreshToken = $token')
            echo "Refresh token was also updated"
          fi

          # Update expiry
          CREDS=$(echo "$CREDS" | jq --argjson exp "$NEW_EXPIRES_AT" '.claudeAiOauth.expiresAt = $exp')

          # Write updated credentials
          echo "$CREDS" > ~/.claude/.credentials.json
          chmod 600 ~/.claude/.credentials.json

          echo "refreshed=true" >> $GITHUB_OUTPUT

      - name: Update credentials variable
        if: steps.restore.outputs.skip != 'true' && steps.refresh.outputs.refreshed == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          # Read updated credentials and push to GitHub
          NEW_ENCODED=$(cat ~/.claude/.credentials.json | base64 -w0)

          gh api -X PATCH repos/${{ github.repository }}/actions/variables/CLAUDE_CREDENTIALS \
            -f name=CLAUDE_CREDENTIALS \
            -f value="$NEW_ENCODED"

          echo "Token refreshed and saved to GitHub variable!"

      - name: Verify refresh succeeded
        if: steps.restore.outputs.skip != 'true'
        run: |
          if [ "${{ steps.refresh.outputs.refreshed }}" != "true" ]; then
            echo "::error::Token refresh failed - credentials unchanged or revoked"
            exit 1
          fi
          echo "::notice::Token refreshed and saved successfully!"
