name: Refresh Claude Token

on:
  schedule:
    # Run every 6 hours (before the 8-hour expiry)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  actions: write      # Required to update repository variables
  contents: read      # Required to checkout

jobs:
  refresh-token:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Claude CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Patch CLI refresh threshold
        run: |
          # The CLI only refreshes tokens within 5 minutes of expiry (300000ms)
          # Patch it to refresh within 8 hours (28800000ms) so scheduled runs work
          CLI_PATH=$(npm root -g)/@anthropic-ai/claude-code/cli.js
          echo "Patching $CLI_PATH"

          # Change: function ec(A){if(A===null)return!1;let Q=300000;
          # To:     function ec(A){if(A===null)return!1;let Q=28800000;
          sed -i 's/function ec(A){if(A===null)return!1;let Q=300000;/function ec(A){if(A===null)return!1;let Q=28800000;/' "$CLI_PATH"

          # Verify the patch
          if grep -q 'function ec(A){if(A===null)return!1;let Q=28800000;' "$CLI_PATH"; then
            echo "Patch applied successfully - refresh threshold now 8 hours"
          else
            echo "Warning: Patch may not have applied correctly"
            grep -o 'function ec(A){if(A===null)return.{0,30}' "$CLI_PATH" || true
          fi

      - name: Restore credentials
        id: restore
        env:
          # Use vars context to access repository variables directly
          ENCODED_CREDS: ${{ vars.CLAUDE_CREDENTIALS }}
        run: |
          if [ -z "$ENCODED_CREDS" ]; then
            echo "No credentials found, skipping refresh"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Decode and save credentials
          mkdir -p ~/.claude
          echo "$ENCODED_CREDS" | base64 -d > ~/.claude/.credentials.json
          chmod 600 ~/.claude/.credentials.json

          # Show current expiry for logging
          EXPIRES_AT=$(cat ~/.claude/.credentials.json | jq -r '.claudeAiOauth.expiresAt')
          EXPIRES_DATE=$(date -d @$((EXPIRES_AT / 1000)) 2>/dev/null || echo "unknown")
          echo "Current token expires at: $EXPIRES_AT ($EXPIRES_DATE)"

          echo "skip=false" >> $GITHUB_OUTPUT
          echo "old_expires_at=$EXPIRES_AT" >> $GITHUB_OUTPUT

      - name: Refresh token via Claude CLI
        if: steps.restore.outputs.skip != 'true'
        id: refresh
        run: |
          # Run a simple Claude command - this triggers internal token refresh
          # With our patched threshold, it will refresh if token expires within 8 hours
          timeout 30 claude --print "Say 'ok'" 2>&1 || true

          # Check if credentials were updated
          NEW_EXPIRES_AT=$(cat ~/.claude/.credentials.json | jq -r '.claudeAiOauth.expiresAt')
          OLD_EXPIRES_AT="${{ steps.restore.outputs.old_expires_at }}"

          if [ "$NEW_EXPIRES_AT" != "$OLD_EXPIRES_AT" ]; then
            NEW_DATE=$(date -d @$((NEW_EXPIRES_AT / 1000)) 2>/dev/null || echo "unknown")
            echo "Token was refreshed! New expiry: $NEW_EXPIRES_AT ($NEW_DATE)"
            echo "refreshed=true" >> $GITHUB_OUTPUT
          else
            echo "Token was not refreshed (expiry unchanged: $NEW_EXPIRES_AT)"
            echo "refreshed=false" >> $GITHUB_OUTPUT
          fi

      - name: Update credentials variable
        if: steps.restore.outputs.skip != 'true' && steps.refresh.outputs.refreshed == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          # Read updated credentials and push to GitHub
          NEW_ENCODED=$(cat ~/.claude/.credentials.json | base64 -w0)

          gh api -X PATCH repos/${{ github.repository }}/actions/variables/CLAUDE_CREDENTIALS \
            -f name=CLAUDE_CREDENTIALS \
            -f value="$NEW_ENCODED"

          echo "Token refreshed and saved to GitHub variable!"

      - name: Verify refresh succeeded
        if: steps.restore.outputs.skip != 'true'
        run: |
          if [ "${{ steps.refresh.outputs.refreshed }}" != "true" ]; then
            echo "::error::Token refresh failed - credentials unchanged or revoked"
            exit 1
          fi
          echo "::notice::Token refreshed and saved successfully!"
